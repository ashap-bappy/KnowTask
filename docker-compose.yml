# docker-compose.yml
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: knowtask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowtask
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: SuperSecret123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d   # optional: seed scripts

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: knowtask-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@knowtask.com
      PGADMIN_DEFAULT_PASSWORD: SuperSecret123!
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  postgres_data: